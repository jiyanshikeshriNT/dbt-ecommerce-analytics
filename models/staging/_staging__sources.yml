version: 2

sources:
  - name: ecommerce
    description: "Raw e-commerce source data used for the dbt practice assignments."
    database: ecommerce_db
    schema: raw

    tables:
      - name: raw_customers
        description: "One row per registered customer."

      - name: raw_orders
        description: "One row per placed order."
        loaded_at_field: _fivetran_synced
        freshness:
          warn_after:
            count: 12
            period: hour
          error_after:
            count: 24
            period: hour

      - name: raw_payments
        description: "One row per payment transaction."
        loaded_at_field: _fivetran_synced
        freshness:
          warn_after:
            count: 12
            period: hour
          error_after:
            count: 24
            period: hour