name: 'ecommerce_analytics'
version: '1.0.0'
config-version: 2

profile: 'ecommerce_analytics'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

vars:
  payment_methods:
  - credit_card
  - gift_card
  - bank_transfer
  - coupon

models:
  ecommerce_analytics:

    staging:
      +materialized: view

    intermediate:
      +materialized: ephemeral

    marts:
      +materialized: table
      +post-hook:
        - "grant select on {{ this }} to analytics_readonly"